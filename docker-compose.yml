services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time flag: NEXT_PUBLIC_* must be baked at build, not runtime.
      # Resolved from the host .env on the build machine (compose interpolation).
      args:
        NEXT_PUBLIC_LOCAL_ONLY: ${NEXT_PUBLIC_LOCAL_ONLY:-false}
    image: screenstyler:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Postgres (Neon) and object storage (R2) are external managed services,
    # so no database container is defined here. All credentials come from .env.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
